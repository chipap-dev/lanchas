services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanchas}
      POSTGRES_USER: ${POSTGRES_USER:-lanchas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanchas}
    volumes:
      - lanchas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanchas} -d ${POSTGRES_DB:-lanchas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lanchas}:${POSTGRES_PASSWORD:-lanchas}@db:5432/${POSTGRES_DB:-lanchas}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lanchas_pg_data:
